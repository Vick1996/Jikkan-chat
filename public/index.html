<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fdeef3" />
  <script>
    // Apply the saved theme (light pink unless the user chose dark) before first paint so there is no flash of the wrong one
    try {
      const t = localStorage.getItem('jk-theme') || 'light';
      document.documentElement.dataset.theme = t;
    } catch { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <title>Jikkan</title>

  <!-- Tailwind, built ahead of time (npm run build:css) instead of compiled in the browser -->
  <link href="/styles.css" rel="stylesheet" />

  <!-- Lora for Latin, Shippori Mincho for Japanese -->
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Shippori+Mincho&display=swap" rel="stylesheet" />

  <style>
    /* Night palette, taken from the logo: warm ink, cream, petal rose. All text pairs are >= 6:1. */
    :root, :root[data-theme="dark"] {
      --ink: #170f13;
      --surface: #21161b;
      --raised: #2f2027;
      --cream: #f6e6ec;
      --muted: #c4a9b4;
      --rose: #8c3553;
      --rose-hover: #7a2c47;
      --theirs: #3d2a33;
      --ring: #f0a5bb;
      --alert: #f2a7a0;
      --on-rose: #f6e6ec;
      --line: #54404a;
      --scrim: rgba(23, 15, 19, 0.78);
      color-scheme: dark;
    }
    /* Day palette: light pink */
    :root[data-theme="light"] {
      --ink: #fdeef3;
      --surface: #fff6f9;
      --raised: #fbe1ea;
      --cream: #3a1f2b;
      --muted: #7a5565;
      --rose: #a8325a;
      --rose-hover: #942a4e;
      --theirs: #f8d7e3;
      --ring: #b0305a;
      --alert: #b3261e;
      --on-rose: #fff6f9;
      --line: #eec0d0;
      --scrim: rgba(255, 246, 249, 0.8);
      color-scheme: light;
    }

    body {
      /* Serif everywhere: Lora for Latin, Shippori Mincho for kana/kanji (Google serves only the glyph slices used). */
      font-family: Lora, 'Shippori Mincho', 'Noto Serif JP', Georgia, 'Times New Roman', serif;
      background: var(--ink);
      color: var(--cream);
      /* --app-h follows the visual viewport, so the on-screen keyboard never covers the input */
      height: var(--app-h, 100dvh);
    }

    :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
    ::placeholder { color: var(--muted); opacity: 1; }
    ::selection { background: var(--rose); color: var(--on-rose); }

    #splash { background-color: #14100f; /* the logo's own background, same in both themes */ transition: opacity 0.5s ease; }
    #splash.hidden { opacity: 0; pointer-events: none; }

    .card { background: var(--surface); color: var(--cream); }
    .btn-rose { background: var(--rose); color: var(--on-rose); min-height: 44px; }
    .btn-rose:hover { background: var(--rose-hover); }
    .btn-rose:disabled { opacity: 0.45; }
    .field { background: var(--raised); color: var(--cream); border: 1px solid var(--line); font-size: 16px; /* 16px stops iOS zoom-on-focus */ }

    /* Chat shell: full screen on phones, a centred card from tablet up */
    #chatApp { width: 100%; max-width: 28rem; height: 100%; background: var(--surface); }
    #chatApp:not(.hidden) { display: flex; }
    @media (min-width: 640px) {
      body { padding: 1rem; }
      #chatApp { height: min(100%, 44rem); border-radius: 1rem; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); overflow: hidden; }
    }

    /* Scrim keeps bubbles legible over the picture. --chat-bg is set from JS (the chosen background, or the default). */
    #messages {
      background-color: var(--surface);
      background-image: linear-gradient(var(--scrim), var(--scrim)), var(--chat-bg, url('chat-background.webp'));
      background-size: cover;
      background-position: center;
    }
    #messages[data-bg="plain"] { background-image: none; }
    dialog#look { background: var(--surface); color: var(--cream); border: 1px solid var(--line); border-radius: 1rem; padding: 1.25rem; width: min(22rem, calc(100vw - 2rem)); }
    dialog#look::backdrop { background: rgba(0, 0, 0, 0.6); }
    .swatch { width: 100%; aspect-ratio: 3 / 4; border-radius: 0.5rem; border: 2px solid var(--line); background-size: cover; background-position: center; background-color: var(--raised); }
    [aria-pressed="true"] > .swatch { border-color: var(--ring); box-shadow: 0 0 0 2px var(--ring); }
    .sun { display: none; }
    :root[data-theme="light"] .sun { display: block; }
    :root[data-theme="light"] .moon { display: none; }
    .mine   { background: var(--rose);   color: var(--on-rose); }
    .theirs { background: var(--theirs); color: var(--cream); }
    .avatar.mine-av   { background: var(--rose); color: var(--on-rose); }
    .avatar.theirs-av { background: var(--raised); }

    .icon-btn { min-width: 44px; min-height: 44px; color: var(--muted); }
    .icon-btn:hover { color: var(--cream); }
    #bellBtn[aria-pressed="true"] { color: var(--ring); }
    #bellBtn[aria-pressed="true"] #bellSlash { display: none; }

    .bubble { cursor: pointer; }

    /* "New messages" marker */
    .divider { display: flex; align-items: center; gap: 0.75rem; margin: 0.5rem 0 0.75rem; color: var(--ring); font-size: 0.75rem; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: currentColor; opacity: 0.4; }

    /* Delivery tick: one check = sent, two = read */
    .tick { width: 16px; height: 16px; color: var(--muted); }
    .tick.read { color: var(--ring); }

    /* Presence line under the title */
    #presence:not(:empty)::before { content: ''; display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 9999px; background: var(--ring); vertical-align: middle; }

    #connBanner { background: var(--raised); color: var(--cream); }
    .field[aria-invalid="true"] { border-color: var(--alert); }
    .hint { color: var(--alert); }
    .hint.ok { color: var(--muted); }
    .retry { color: var(--alert); min-height: 44px; text-decoration: underline; text-underline-offset: 3px; }

    /* Petal fall animation */
    @keyframes fall {
      0%   { transform: translateY(-50px) rotate(0deg); opacity: 1; }
      90%  { transform: translateY( calc(100vh - 50px) ) rotate(360deg); opacity: 1; }
      100% { transform: translateY(calc(100vh + 50px)) rotate(360deg); opacity: 0; }
    }

    .petal {
      position: absolute;
      top: -50px;
      width: 20px;
      height: 20px;
      background: radial-gradient(circle at 50% 50%, #f8bbd0 40%, #ec407a);
      border-radius: 50% 50% 50% 20%;
      animation-name: fall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .petal { display: none; }
      .animate-pulse { animation: none; }
      #splash { transition: none; }
    }
  </style>
</head>
<body class="flex items-center justify-center overflow-hidden">

  <!-- Splash Screen: stays until the server answers (a sleeping server can take ~1 min) -->
  <div id="splash" class="fixed inset-0 flex flex-col items-center justify-center gap-4 z-50">
    <img src="logo.webp" alt="Jikkan" width="256" height="256" class="w-64 h-64 animate-pulse" />
    <p id="splashNote" role="status" class="hidden text-center px-6" style="color: var(--muted)">
      Waking up&hellip; this can take a minute.
    </p>
  </div>

  <!-- Sign-in Modal (also used to choose a new password after a reset email) -->
  <div id="authModal" role="dialog" aria-modal="true" aria-labelledby="authTitle"
       class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center hidden z-20 p-4">
    <form id="authForm" class="card p-6 rounded-2xl w-full max-w-xs" novalidate>
      <h2 id="authTitle" class="text-2xl font-semibold mb-4 text-center">Sign in</h2>
      <div id="emailWrap">
        <label for="emailInput" class="block text-sm mb-1" style="color: var(--muted)">Email</label>
        <input id="emailInput" type="email" autocomplete="email" aria-describedby="emailHint" class="field w-full px-4 py-2 min-h-[44px] rounded-lg" />
        <p id="emailHint" class="text-xs min-h-[1.25rem] mt-1 hint" role="status"></p>
      </div>
      <label id="passwordLabel" for="passwordInput" class="block text-sm mb-1 mt-1" style="color: var(--muted)">Password</label>
      <input id="passwordInput" type="password" autocomplete="current-password" aria-describedby="passwordHint" class="field w-full px-4 py-2 min-h-[44px] rounded-lg" />
      <p id="passwordHint" class="text-xs min-h-[1.25rem] mt-1 hint" role="status"></p>
      <p id="authMsg" role="alert" class="text-sm mb-2 min-h-[1.25rem]"></p>
      <button id="authBtn" type="submit" class="btn-rose w-full px-4 py-2 rounded-lg">Sign in</button>
      <button id="forgotBtn" type="button" class="retry w-full text-sm mt-1" style="color: var(--muted)">Forgot password?</button>
    </form>
  </div>

  <!-- Romantic Popup Modal -->
  <div id="romanticModal" role="dialog" aria-modal="true" aria-labelledby="romanticTitle"
       class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center hidden z-30 p-4">
    <div id="petalsContainer" class="absolute inset-0 overflow-hidden" aria-hidden="true"></div>
    <div class="card relative p-6 rounded-2xl w-full max-w-xs text-center">
      <h3 id="romanticTitle" class="text-xl font-medium mb-4">A Special Note</h3>
      <p id="romanticText" class="mb-6 text-lg"></p>
      <button id="romanticBtn" class="btn-rose px-4 py-2 rounded-lg">Let's Chat</button>
    </div>
  </div>

  <!-- Chat background picker -->
  <dialog id="look" aria-labelledby="lookTitle">
    <h2 id="lookTitle" class="text-lg font-bold mb-3">Chat background</h2>
    <div class="grid grid-cols-3 gap-3 text-xs text-center">
      <button type="button" data-bg="photo" class="block"><span class="swatch block" style="background-image:url('chat-background.webp')"></span><span class="block mt-1">Photo</span></button>
      <button type="button" data-bg="plain" class="block"><span class="swatch block"></span><span class="block mt-1">Plain</span></button>
      <button type="button" data-bg="custom" id="customSwatch" class="hidden"><span class="swatch block"></span><span class="block mt-1">Yours</span></button>
    </div>
    <input id="bgFile" type="file" accept="image/*" class="sr-only" tabindex="-1" />
    <p id="bgMsg" class="hint text-sm mt-2 min-h-[1.25rem]" role="status"></p>
    <p class="text-xs mt-1" style="color: var(--muted)">Saved on this device only. Your own picture is shrunk to fit.</p>
    <div class="flex gap-2 mt-4">
      <button type="button" id="bgPick" class="btn-rose flex-1 px-4 py-2 rounded-lg">Choose a picture</button>
      <button type="button" id="bgClose" class="field flex-1 px-4 py-2 rounded-lg" style="min-height:44px">Done</button>
    </div>
  </dialog>

  <!-- Main Chat UI -->
  <main id="chatApp" class="hidden flex-col">
    <header class="px-4 py-1 flex items-center justify-between" style="background: var(--raised)">
      <div>
        <h1 id="appName" class="text-2xl font-bold leading-tight">Jikkan <span lang="ja" class="text-sm font-normal" style="color: var(--muted)">実感</span></h1>
        <p id="presence" class="text-xs min-h-[1rem]" style="color: var(--muted)" role="status"></p>
      </div>
      <div class="flex items-center">
        <button id="themeBtn" class="icon-btn flex items-center justify-center rounded-lg" aria-label="Switch to light mode" title="Light / dark">
          <svg class="moon h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
          <svg class="sun h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true" viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="4" stroke-width="2"/><path stroke-linecap="round" stroke-width="2" d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button id="bgBtn" class="icon-btn flex items-center justify-center rounded-lg" aria-label="Chat background" title="Chat background" aria-haspopup="dialog">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" aria-hidden="true" viewBox="0 0 24 24" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2" stroke-width="2"/><circle cx="8.5" cy="8.5" r="1.5" stroke-width="2"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 15l-5-5L5 21"/></svg>
        </button>
        <button id="bellBtn" class="icon-btn flex items-center justify-center rounded-lg" aria-pressed="false" aria-label="Notifications off" title="Notifications off">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" aria-hidden="true" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2a2 2 0 01-.6 1.4L4 17h5m6 0a3 3 0 11-6 0m6 0H9" />
            <path id="bellSlash" stroke-linecap="round" stroke-width="2" d="M4 4l16 16" />
          </svg>
        </button>
        <button id="logoutBtn" class="icon-btn flex items-center justify-center rounded-lg" title="Sign out" aria-label="Sign out">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" aria-hidden="true"
               viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Connection status: only visible when something is wrong -->
    <div id="connBanner" role="status" class="hidden px-4 py-2 text-sm text-center"></div>

    <div id="messages" role="log" aria-live="polite" aria-label="Conversation"
         class="flex-1 p-4 overflow-y-auto relative"></div>

    <div id="charCount" class="hidden px-4 pt-1 text-xs text-right" style="background: var(--raised); color: var(--muted)"></div>
    <form id="form" class="flex gap-2 p-2" style="background: var(--raised); padding-bottom: max(0.5rem, env(safe-area-inset-bottom))" novalidate>
      <input id="input" type="text" placeholder="Type a message..." aria-label="Message" autocomplete="off" maxlength="2000"
             class="field flex-1 px-4 py-2 min-h-[44px] rounded-lg" required />
      <button type="submit" id="sendBtn" class="btn-rose px-5 py-2 rounded-lg" disabled>Send</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
  <!-- Socket.IO -->
  <script src="https://cdn.socket.io/4.7.1/socket.io.min.js"></script>
  <script>
    let socket, sb, vapidKey;
    let name = '';
    let opened = false;       // chat screen shown
    let authReady = false;    // sign-in form or chat is ready, so the splash may go
    let notificationsOn = false;
    let myLastReadAt = null;  // when I last had the chat open (for the "new messages" marker)
    let othersReadAt = null;  // when the other person last had the chat open (for read ticks)
    let authMode = 'signin';  // 'signin' | 'newpass'
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const SPECIAL_NAMES = ['nikya', 'nikita', 'nikku'];

    // Elements
    const authModal     = document.getElementById('authModal');
    const authForm      = document.getElementById('authForm');
    const authTitle     = document.getElementById('authTitle');
    const authMsg       = document.getElementById('authMsg');
    const authBtn       = document.getElementById('authBtn');
    const forgotBtn     = document.getElementById('forgotBtn');
    const emailWrap     = document.getElementById('emailWrap');
    const emailInput    = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const passwordLabel = document.getElementById('passwordLabel');
    const emailHint     = document.getElementById('emailHint');
    const passwordHint  = document.getElementById('passwordHint');
    const charCount     = document.getElementById('charCount');
    const presence      = document.getElementById('presence');
    const romanticModal = document.getElementById('romanticModal');
    const romanticText  = document.getElementById('romanticText');
    const romanticBtn   = document.getElementById('romanticBtn');
    const petalsContainer = document.getElementById('petalsContainer');
    const chatApp       = document.getElementById('chatApp');
    const messages      = document.getElementById('messages');
    const form          = document.getElementById('form');
    const input         = document.getElementById('input');
    const sendBtn       = document.getElementById('sendBtn');
    const logoutBtn     = document.getElementById('logoutBtn');
    const bellBtn       = document.getElementById('bellBtn');
    const connBanner    = document.getElementById('connBanner');
    const splash        = document.getElementById('splash');
    const splashNote    = document.getElementById('splashNote');

    // Track the visual viewport so the on-screen keyboard never hides the input
    const vv = window.visualViewport;
    function fitViewport() {
      document.documentElement.style.setProperty('--app-h', (vv ? vv.height : innerHeight) + 'px');
      window.scrollTo(0, 0);
    }
    fitViewport();
    vv?.addEventListener('resize', fitViewport);
    addEventListener('resize', fitViewport);

    // ---------- Message bits: time (shown on tap), delivery tick, "new messages" marker ----------
    function fmtTime(ts) {
      const d = new Date(ts);
      const t = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      return d.toDateString() === new Date().toDateString() ? t : `${d.toLocaleDateString([], { month: 'short', day: 'numeric' })}, ${t}`;
    }

    const TICK_SENT = '<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg><span class="sr-only">Sent</span>';
    const TICK_READ = '<svg class="tick read" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 13l4 4L16 7M9 17l1 1L22 7"/></svg><span class="sr-only">Read</span>';

    // Own message: one check once the server has it, two once the other person has had the chat open since.
    function renderTick(wrapper) {
      const tick = wrapper.querySelector('.tick-slot');
      if (!tick || !wrapper.dataset.ts) return;
      const read = othersReadAt && new Date(wrapper.dataset.ts) <= new Date(othersReadAt);
      tick.innerHTML = read ? TICK_READ : TICK_SENT;
    }
    function applyReceipts() { messages.querySelectorAll('[data-own][data-ts]').forEach(renderTick); }

    // The server has stored the message: give it its time and show the tick
    function stamp(col, ts) {
      const wrapper = col.parentElement;
      wrapper.dataset.ts = ts;
      const time = col.querySelector('time');
      time.dateTime = ts; time.textContent = fmtTime(ts);
      col.querySelector('.meta').classList.remove('hidden');
      renderTick(wrapper);
    }

    function addDivider() {
      const el = document.createElement('div');
      el.className = 'divider';
      el.setAttribute('role', 'separator');
      el.innerHTML = '<span>New messages</span>';
      messages.appendChild(el);
      return el;
    }

    // Land on the first new message if there is one, otherwise the bottom
    function scrollToFresh() {
      const d = messages.querySelector('.divider');
      if (d) messages.scrollTop = d.offsetTop - 8;
      else messages.scrollTop = messages.scrollHeight;
    }

    // Tell the server I can see the chat (it drives the other person's read ticks and my own unread marker)
    let readTimer;
    function markRead() {
      if (document.hidden || !opened || !socket?.connected) return;
      clearTimeout(readTimer);
      readTimer = setTimeout(() => socket.emit('read'), 300);
    }

    // Display a text message bubble. Tap the bubble to show or hide its time. Own messages get a delivery tick
    // and, while sending, a status line (sending / not sent).
    function displayMessage(sender, msg, ts) {
      const mine = sender === name;
      const wrapper = document.createElement('div');
      wrapper.className = `flex items-start mb-3 gap-2 ${mine ? 'justify-end' : 'justify-start'}`;
      const avatar = document.createElement('div');
      avatar.className = `avatar w-8 h-8 shrink-0 rounded-full flex items-center justify-center font-bold ${mine ? 'mine-av' : 'theirs-av'}`;
      avatar.setAttribute('aria-hidden', 'true');
      avatar.textContent = sender.charAt(0).toUpperCase();
      const col = document.createElement('div');
      col.className = `flex flex-col ${mine ? 'items-end' : 'items-start'}`;
      col.style.maxWidth = '78%';
      const who = document.createElement('span');
      who.className = 'sr-only';
      who.textContent = `${sender}: `;
      const bubble = document.createElement('div');
      bubble.className = `bubble px-3 py-2 rounded-2xl break-words ${mine ? 'mine' : 'theirs'}`;
      bubble.textContent = msg;
      // Time is hidden until the bubble is tapped (or Enter/Space on it); own messages keep their tick visible
      bubble.tabIndex = 0;
      bubble.setAttribute('role', 'button');
      bubble.setAttribute('aria-expanded', 'false');
      const meta = document.createElement('div');
      meta.className = 'meta flex items-center gap-2 text-xs mt-1';
      meta.style.color = 'var(--muted)';
      const time = document.createElement('time');
      time.className = 'hidden';
      meta.append(time);
      if (mine) {
        const slot = document.createElement('span');
        slot.className = 'tick-slot flex items-center';
        meta.append(slot);
        wrapper.dataset.own = '1';
      }
      if (ts) { time.dateTime = ts; time.textContent = fmtTime(ts); wrapper.dataset.ts = ts; }
      // Others' rows (and own rows still sending) have nothing to show until the time is toggled / acked
      meta.classList.toggle('hidden', !(mine && ts));
      const toggleTime = () => {
        if (!time.textContent) return;
        const show = time.classList.toggle('hidden') === false;
        bubble.setAttribute('aria-expanded', String(show));
        if (!mine) meta.classList.toggle('hidden', !show);
      };
      bubble.addEventListener('click', toggleTime);
      bubble.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleTime(); } });
      col.append(who, bubble, meta);
      if (mine) wrapper.append(col, avatar);
      else wrapper.append(avatar, col);
      renderTick(wrapper);
      messages.appendChild(wrapper);
      messages.scrollTop = messages.scrollHeight;
      return col;
    }

    // Create a single falling petal
    function createPetal() {
      if (reduceMotion) return;
      const petal = document.createElement('div');
      petal.classList.add('petal');
      petal.style.left = Math.random() * window.innerWidth + 'px';
      petal.style.animationDuration = (3 + Math.random() * 3) + 's';
      petal.style.animationDelay = Math.random() * 2 + 's';
      petalsContainer.appendChild(petal);
      setTimeout(() => petal.remove(), 6000);
    }

    // Burst petals on login
    function burstPetals(count = 50) {
      for (let i = 0; i < count; i++) createPetal();
      const iv = setInterval(() => createPetal(), 300);
      setTimeout(() => clearInterval(iv), 5000);
    }

    function openChat() {
      opened = true;
      authReady = true;
      romanticModal.classList.add('hidden');
      authModal.classList.add('hidden');
      chatApp.classList.remove('hidden');
      input.focus();
      scrollToFresh();
      markRead();
      if (!socket?.connected) showBanner('Connecting…');
      hideSplash();
    }

    // ---------- Live validation ----------
    // A field only starts complaining after you leave it once (so "gir" never errors mid-typing);
    // from then on it re-checks on every keystroke and the message clears the moment the value is OK.
    // New-password feedback is live from the first keystroke, since that rule is something you need to see.
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
    const touched = new Set();
    function setHint(field, hintEl, msg, ok = false) {
      hintEl.textContent = msg;
      hintEl.className = 'text-xs min-h-[1.25rem] mt-1 hint' + (ok ? ' ok' : '');
      field.setAttribute('aria-invalid', String(!!msg && !ok));
    }
    function checkEmail(show) {
      const v = emailInput.value.trim();
      const msg = !v ? 'Enter your email.' : EMAIL_RE.test(v) ? '' : 'That doesn’t look like an email address.';
      if (show || touched.has('email')) setHint(emailInput, emailHint, msg);
      return !msg;
    }
    function checkPassword(show) {
      const v = passwordInput.value;
      let msg = '', ok = false;
      if (authMode === 'newpass') {
        const need = 8 - v.length;
        if (need > 0) msg = v ? `${need} more character${need === 1 ? '' : 's'} needed.` : 'Use at least 8 characters.';
        else ok = true;
      } else if (!v) msg = 'Enter your password.';
      if (show || touched.has('password')) setHint(passwordInput, passwordHint, ok ? 'Looks good.' : msg, ok);
      return !msg;
    }
    emailInput.addEventListener('input', () => checkEmail(false));
    emailInput.addEventListener('blur', () => { if (emailInput.value) { touched.add('email'); checkEmail(false); } });
    passwordInput.addEventListener('input', () => { if (authMode === 'newpass') touched.add('password'); checkPassword(false); });
    passwordInput.addEventListener('blur', () => { if (passwordInput.value) { touched.add('password'); checkPassword(false); } });

    // ---------- Sign-in ----------
    function showAuth(mode, message = '', isError = true) {
      authMode = mode;
      touched.clear();
      setHint(emailInput, emailHint, '');
      setHint(passwordInput, passwordHint, '');
      const newpass = mode === 'newpass';
      authTitle.textContent = newpass ? 'Choose a new password' : 'Sign in';
      authBtn.textContent = newpass ? 'Save password' : 'Sign in';
      passwordLabel.textContent = newpass ? 'New password' : 'Password';
      passwordInput.autocomplete = newpass ? 'new-password' : 'current-password';
      emailWrap.classList.toggle('hidden', newpass);
      forgotBtn.classList.toggle('hidden', newpass);
      authMsg.textContent = message;
      authMsg.style.color = isError ? 'var(--alert)' : 'var(--muted)';
      chatApp.classList.add('hidden');
      authModal.classList.remove('hidden');
      authReady = true;
      hideSplash();
      (newpass ? passwordInput : emailInput).focus();
    }

    authForm.addEventListener('submit', async e => {
      e.preventDefault();
      authBtn.disabled = true;
      try {
        if (authMode === 'newpass') {
          if (!checkPassword(true)) return passwordInput.focus();
          const { error } = await sb.auth.updateUser({ password: passwordInput.value });
          if (error) return showAuth('newpass', error.message);
          history.replaceState(null, '', location.pathname);
          passwordInput.value = '';
          return startSession();
        }
        const email = emailInput.value.trim();
        const okEmail = checkEmail(true), okPass = checkPassword(true);
        if (!okEmail || !okPass) return (okEmail ? passwordInput : emailInput).focus();
        const { error } = await sb.auth.signInWithPassword({ email, password: passwordInput.value });
        if (error) return showAuth('signin', 'Email or password is wrong.');
        passwordInput.value = '';
        // Asked here because it needs a tap; the answer decides whether the bell can turn on
        if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
        startSession();
      } finally {
        authBtn.disabled = false;
      }
    });

    forgotBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if (!checkEmail(true)) return emailInput.focus();
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin });
      showAuth('signin', error ? 'Could not send the email. Try again in a minute.' : 'Check your email for a reset link.', !!error);
    });

    // Sign out = manual only. Also stop pushes to this device so a shared browser stays private.
    // ponytail: the server forgets the dead subscription on its next failed push (410), not instantly.
    // ---------- Look: light/dark theme and chat background (both saved on this device only) ----------
    const store = {
      get: k => { try { return localStorage.getItem(k); } catch { return null; } },
      set: (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; } }
    };
    const themeBtn = document.getElementById('themeBtn');
    function applyTheme(t) {
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name="theme-color"]').content = t === 'light' ? '#fdeef3' : '#170f13';
      themeBtn.setAttribute('aria-label', t === 'light' ? 'Switch to dark mode' : 'Switch to light mode');
    }
    applyTheme(document.documentElement.dataset.theme);
    themeBtn.onclick = () => {
      const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      applyTheme(t); store.set('jk-theme', t);
    };

    const look = document.getElementById('look');
    const bgMsg = document.getElementById('bgMsg');
    const bgFile = document.getElementById('bgFile');
    const customSwatch = document.getElementById('customSwatch');
    function applyBg(choice) {
      const custom = store.get('jk-bg-custom');
      if (choice === 'custom' && !custom) choice = 'photo';
      messages.dataset.bg = choice;
      if (choice === 'custom') messages.style.setProperty('--chat-bg', `url("${custom}")`);
      else messages.style.removeProperty('--chat-bg');
      customSwatch.classList.toggle('hidden', !custom);
      if (custom) customSwatch.firstElementChild.style.backgroundImage = `url("${custom}")`;
      look.querySelectorAll('[data-bg]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.bg === choice)));
    }
    applyBg(store.get('jk-bg') || 'photo');
    look.querySelectorAll('[data-bg]').forEach(b => b.onclick = () => { store.set('jk-bg', b.dataset.bg); applyBg(b.dataset.bg); bgMsg.textContent = ''; });
    document.getElementById('bgBtn').onclick = () => { bgMsg.textContent = ''; look.showModal(); };
    document.getElementById('bgClose').onclick = () => look.close();
    look.addEventListener('click', e => { if (e.target === look) look.close(); });   // click on the backdrop
    document.getElementById('bgPick').onclick = () => bgFile.click();

    // Shrink the picture first: phones take 5 MB+ photos and localStorage holds about 5 MB in total.
    bgFile.onchange = async () => {
      const f = bgFile.files[0]; bgFile.value = '';
      if (!f) return;
      if (!f.type.startsWith('image/')) { bgMsg.textContent = 'That file is not a picture.'; return; }
      try {
        const bmp = await createImageBitmap(f);
        const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
        const c = document.createElement('canvas');
        c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
        c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
        const url = c.toDataURL('image/jpeg', 0.75);
        if (!store.set('jk-bg-custom', url)) { bgMsg.textContent = 'No room to save it on this device. Try a smaller picture.'; return; }
        store.set('jk-bg', 'custom'); applyBg('custom'); bgMsg.textContent = '';
      } catch { bgMsg.textContent = 'Could not open that picture. Try a JPG or PNG.'; }
    };

    logoutBtn.onclick = async () => {
      try {
        const reg = await navigator.serviceWorker?.getRegistration();
        (await reg?.pushManager.getSubscription())?.unsubscribe();
      } catch {}
      await sb.auth.signOut();
      location.reload();
    };

    // ---------- Sending ----------
    // Send is off for an empty message; a counter appears when you get close to the 2000-character limit
    input.addEventListener('input', () => {
      sendBtn.disabled = input.value.trim() === '';
      const n = input.value.length;
      charCount.classList.toggle('hidden', n < 1800);
      charCount.textContent = n >= 2000 ? 'Limit reached: 2000 / 2000' : `${n} / 2000`;
      charCount.style.color = n >= 2000 ? 'var(--alert)' : 'var(--muted)';
    });

    // "Sending..." only if the ack is slow; on failure keep the text and offer retry. Same id on retry = no duplicate.
    function deliver(col, text, id) {
      let status = col.querySelector('.status');
      if (status) status.remove();
      status = document.createElement('div');
      status.className = 'status text-xs mt-1 min-h-[1rem]';
      status.style.color = 'var(--muted)';
      col.appendChild(status);
      col.parentElement.dataset.pending = '1';
      const slow = setTimeout(() => { status.textContent = 'Sending…'; }, 800);
      // socket.io buffers the emit while offline and sends it on reconnect; timeout drops it from the buffer
      socket.timeout(10000).emit('chat message', { id, msg: text }, (err, res) => {
        clearTimeout(slow);
        if (!err && res?.ok) { status.remove(); delete col.parentElement.dataset.pending; stamp(col, res.ts); return; }
        status.innerHTML = '';
        const retry = document.createElement('button');
        retry.type = 'button';
        retry.className = 'retry text-sm';
        retry.textContent = 'Not sent. Tap to retry';
        retry.onclick = () => deliver(col, text, id);
        status.appendChild(retry);
      });
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      deliver(displayMessage(name, text), text, crypto.randomUUID());
      input.value = '';
      sendBtn.disabled = true;
      charCount.classList.add('hidden');
      input.focus();
    });

    // ---------- Notifications (one switch per account; each device registers itself) ----------
    const baseTitle = document.title;
    let unread = 0;
    const swReady = 'serviceWorker' in navigator ? navigator.serviceWorker.register('/sw.js').then(() => navigator.serviceWorker.ready) : Promise.resolve();
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) { unread = 0; document.title = baseTitle; markRead(); }
    });
    addEventListener('focus', markRead);

    function renderBell() {
      const on = notificationsOn && 'Notification' in window && Notification.permission === 'granted';
      bellBtn.setAttribute('aria-pressed', String(on));
      const label = on ? 'Notifications on' : 'Notifications off';
      bellBtn.setAttribute('aria-label', label);
      bellBtn.title = label;
    }

    function b64ToBytes(b64) {
      const pad = '='.repeat((4 - b64.length % 4) % 4);
      const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
      return Uint8Array.from(raw, c => c.charCodeAt(0));
    }

    // Register this device for pushes (safe to repeat: the server upserts by endpoint)
    async function ensurePush() {
      if (!('PushManager' in window) || Notification.permission !== 'granted') return;
      const reg = await swReady;
      const sub = (await reg.pushManager.getSubscription())
        || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(vapidKey) });
      socket.emit('push:subscribe', sub.toJSON());
    }

    bellBtn.addEventListener('click', async () => {
      const on = bellBtn.getAttribute('aria-pressed') === 'true';
      if (on) {
        notificationsOn = false;
        socket.emit('notifications:set', false);
      } else {
        if (!('Notification' in window)) return showBanner('This browser does not support notifications.');
        if (Notification.permission === 'default') await Notification.requestPermission();
        if (Notification.permission !== 'granted') return showBanner('Notifications are blocked. Allow them in your browser’s site settings.');
        notificationsOn = true;
        socket.emit('notifications:set', true);
        ensurePush();
      }
      renderBell();
    });

    // ---------- Realtime ----------
    function showBanner(text) {
      if (chatApp.classList.contains('hidden')) return;
      connBanner.textContent = text;
      connBanner.classList.remove('hidden');
    }

    function wireSocket() {
      // auth as a function: every (re)connect sends a fresh token, so an expired one never strands the chat
      socket = io({ auth: cb => sb.auth.getSession().then(({ data }) => cb({ token: data.session?.access_token })) });

      socket.on('connect', () => {
        connBanner.classList.add('hidden');
      });
      socket.on('disconnect', () => showBanner('Offline. Messages will send when you are back.'));
      socket.on('connect_error', err => {
        if (err.message === 'unauthorized') return sb.auth.signOut().then(() => showAuth('signin', 'Please sign in again.'));
        if (err.message === 'forbidden') return showAuth('signin', 'This account is not a member of the chat.');
        showBanner('Can’t reach the server. Retrying…');
      });

      // Who I am, my aliases, and my notification setting. First one opens the chat.
      socket.on('me', me => {
        name = me.name;
        myLastReadAt = me.lastReadAt;
        othersReadAt = me.othersReadAt;
        notificationsOn = me.notificationsEnabled;
        renderBell();
        if (notificationsOn) ensurePush();
        if (opened) return;
        const special = [me.name, ...me.aliases].some(n => SPECIAL_NAMES.includes(n.toLowerCase()));
        if (special) {
          authModal.classList.add('hidden');
          burstPetals();
          romanticText.textContent = getRandomRomantic();
          romanticModal.classList.remove('hidden');
          romanticBtn.onclick = openChat;
          romanticBtn.focus();
          authReady = true;
          hideSplash();
        } else {
          openChat();
        }
      });

      // Re-render from history (also runs after reconnects), but keep bubbles still waiting for their ack
      socket.on('chat history', history => {
        const pending = [...messages.querySelectorAll('[data-pending]')];
        messages.innerHTML = '';
        // "New messages" marker goes before the first message from someone else that is newer than when I last had the chat open
        let marked = false;
        history.forEach(m => {
          if (!marked && myLastReadAt && m.name !== name && new Date(m.ts) > new Date(myLastReadAt)) { addDivider(); marked = true; }
          displayMessage(m.name, m.msg, m.ts);
        });
        pending.forEach(p => messages.appendChild(p));
        scrollToFresh();
        markRead();
      });

      // System notifications come from Web Push (service worker); here only the unread count in the tab title
      socket.on('chat message', data => {
        displayMessage(data.name, data.msg, data.ts);
        if (document.hidden) { unread++; document.title = `(${unread}) ${baseTitle}`; }
        else markRead();
      });

      // The other person had the chat open: everything I sent up to then is read
      socket.on('read', r => { othersReadAt = r.ts; applyReceipts(); });

      // Who is here right now
      socket.on('presence', p => {
        const others = p.online.filter(n => n !== name);
        presence.textContent = others.length ? `${others.join(' & ')} ${others.length > 1 ? 'are' : 'is'} here` : '';
      });
    }

    function startSession() {
      authModal.classList.add('hidden');
      wireSocket();
    }

    // Romantic message pool
    const romanticPool = [
      "My heart beats for you, {name}.",
      "{name}, you light up my world.",
      "Every thought leads me to you, {name}.",
      "With you, {name}, life blooms.",
      "You are my sunshine, {name}.",
      "My favorite hello is your name, {name}.",
      "{name}, you make my heart smile.",
      "In your eyes, {name}, I find home.",
      "You are my dream come true, {name}.",
      "Every moment with you is magic, {name}.",
      "My world is brighter with you, {name}.",
      "{name}, you are my sweetest melody.",
      "You are the reason I believe in love, {name}.",
      "{name}, you've captured my heart.",
      "Forever feels less without you, {name}."
    ];

    function getRandomRomantic() {
      const t = romanticPool[Math.floor(Math.random() * romanticPool.length)];
      return t.replace("{name}", name);
    }

    // Splash: at least 2s, and only once there is something to show (sign-in form or the chat). After 4s say why
    // it's slow; after 12s give up waiting and open the chat shell so the banner can explain.
    let minShown = false, splashGone = false;
    function hideSplash(force) {
      if (splashGone || (!force && !(minShown && authReady))) return;
      splashGone = true;
      splash.classList.add('hidden');
      setTimeout(() => splash.remove(), 500);
    }
    // Started right away, not on window 'load': the 1.8 MB logo would otherwise delay everything by its download time.
    setTimeout(() => { minShown = true; hideSplash(); }, 2000);
    setTimeout(() => { if (!splashGone) splashNote.classList.remove('hidden'); }, 4000);
    setTimeout(() => { if (!splashGone) { if (!authReady) openChat(); hideSplash(true); } }, 12000);

    // ---------- Boot ----------
    (async () => {
      const cfg = await (await fetch('/config')).json();
      vapidKey = cfg.vapidPublicKey;
      sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
      // A password-reset email link lands here with type=recovery in the URL
      if (location.hash.includes('type=recovery')) {
        sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') showAuth('newpass', '', false); });
        return;
      }
      const { data: { session } } = await sb.auth.getSession();
      if (session) startSession();
      else showAuth('signin', '', false);
    })();
  </script>
</body>
</html>
